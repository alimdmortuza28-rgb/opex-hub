  .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;opacity:.75;margin-bottom:6px;}

  .search-row{display:flex;gap:10px;align-items:center;margin:18px 0 12px;flex-wrap:wrap;}
  .searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;}
  .searchbox input{flex:1;border:0;outline:0;font-size:14px;font-family:inherit;background:transparent;color:var(--ink);}
  .searchbox input::placeholder{color:#9aa3b2;}
  .count{font-size:12px;color:var(--muted);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .gchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .gchip{background:#eef1f8;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .gchip.on{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px -14px rgba(20,63,143,.25);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:var(--accent-dark);color:#fff;text-align:left;padding:11px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
  thead th.r,td.r{text-align:right;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f7f9ff;}
  .code{color:var(--accent);font-weight:700;white-space:nowrap;}
  .sec{display:inline-block;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:800;color:#fff;letter-spacing:.02em;}
  .sec.gss{background:var(--gss);} .sec.led{background:var(--led);} .sec.hap{background:var(--hap);}
  .grp{color:var(--muted);font-size:12px;}
  .name{font-weight:600;}
  .smv{font-weight:800;color:var(--accent-dark);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .signature{text-align:center;font-size:11.5px;color:var(--muted);margin-top:24px;}
</style>

<script>
const ITEMS = JSON.parse(document.getElementById('bulletin-data').textContent || '[]');
const sections = ["All", ...Array.from(new Set(ITEMS.map(i => i.section)))];
const groups = ["All", ...Array.from(new Set(ITEMS.map(i => i.group)))];
let activeSec = "All", activeGroup = "All";

function renderChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  sections.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (s === activeSec ? ' on' : '');
    b.textContent = s + (s === 'All' ? ' (' + ITEMS.length + ')' : ' (' + ITEMS.filter(i => i.section === s).length + ')');
    b.addEventListener('click', () => { activeSec = s; renderChips(); render(); });
    box.appendChild(b);
  });
  const gbox = document.getElementById('gchips');
  gbox.innerHTML = '';
  groups.forEach(g => {
    const b = document.createElement('button');
    b.className = 'gchip' + (g === activeGroup ? ' on' : '');
    b.textContent = g;
    b.addEventListener('click', () => { activeGroup = g; renderChips(); render(); });
    gbox.appendChild(b);
  });
}

function render(){
  const q = (document.getElementById('q').value || '').toLowerCase();
  const rows = ITEMS.filter(i => {
    const inSec = activeSec === 'All' || i.section === activeSec;
    const inGroup = activeGroup === 'All' || i.group === activeGroup;
    const inSearch = !q || i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q) || i.group.toLowerCase().includes(q);
    return inSec && inGroup && inSearch;
  });
  document.getElementById('count').textContent = rows.length + ' items';
  document.getElementById('tbody').innerHTML = rows.map(i => `
    <tr>
      <td class="code">${i.code}</td>
      <td><span class="sec ${i.section.toLowerCase()}">${i.section}</span></td>
      <td class="grp">${i.group}</td>
      <td class="name">${i.name}</td>
      <td class="r smv">${i.smv || '—'}</td>
    </tr>`).join('');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
}
document.getElementById('q').addEventListener('input', render);
renderChips();
render();
</script>
